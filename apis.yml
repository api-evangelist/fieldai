aid: fieldai
name: Field AI
description: >-
  Field AI is a physical-AI robotics company founded in 2023 and based in Mission
  Viejo, California, building Field Foundation Models (FFMs) — a class of risk-aware,
  embodied AI that gives general-purpose robots a single "brain" (marketed as EDGE)
  that works across many robots, tasks, and unstructured real-world environments.
  Its Belief World Model reasons under uncertainty and runs entirely on the edge,
  without pre-built maps, GPS, or pre-programmed paths, integrating vision, LiDAR,
  and other multimodal sensor data. Field AI has production deployments across three
  continents and serves construction, urban operations, industrial and energy,
  federal/government, manufacturing, mining, power and utility, and agriculture,
  with partnerships including Boston Dynamics, NVIDIA (Omniverse), and Certis. The
  company is backed by Khosla Ventures. This API Evangelist profile tracks Field AI
  as a network company; the enrichment pipeline found no public developer API,
  OpenAPI, SDK, or documentation surface as of this pass.
